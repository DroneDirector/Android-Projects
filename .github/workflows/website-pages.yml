name: Website preview (GitHub Pages)
# Builds the website on a fresh WordPress + Elementor, saves the four pages as plain files and publishes
# them to GitHub Pages: https://dronedirector.github.io/Android-Projects/ (a preview — editing needs WordPress).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ "Website/**", "ProCamera/FEATURES.md", ".github/workflows/website-pages.yml", ".github/scripts/website/**" ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Feature lists from the app's FEATURES.md
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 .github/scripts/website/features.py ProCamera/FEATURES.md Website/alcorcut-site/data
          if ! git diff --quiet -- Website/alcorcut-site/data; then
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add Website/alcorcut-site/data
            git commit -qm "Website: feature lists updated from FEATURES.md [skip ci]"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
          # The plugin, ready to upload to WordPress (its own release, never the app's "latest").
          (cd Website && zip -qr "$RUNNER_TEMP/alcorcut-site.zip" alcorcut-site)
          gh release view website-plugin -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create website-plugin -R "$GITHUB_REPOSITORY" --title "AlcorCut Pro website plugin (WordPress + Elementor)" \
              --notes "The website plugin, updated automatically whenever the website or the app's feature list changes. Upload alcorcut-site.zip in WordPress → Plugins → Add New → Upload Plugin (Elementor must be active)." --prerelease --latest=false
          gh release upload website-plugin "$RUNNER_TEMP/alcorcut-site.zip" --clobber -R "$GITHUB_REPOSITORY"
      - name: WordPress + Elementor + AlcorCut plugin
        run: bash .github/scripts/website/setup-wp.sh
      - name: Save the pages as plain files
        run: |
          LIVE="https://dronedirector.github.io/Android-Projects"
          mkdir -p /tmp/mirror && cd /tmp/mirror
          for p in "" capture-features/ photo-editor-features/ video-editor-features/; do
            wget -q -e robots=off --page-requisites --adjust-extension --no-host-directories -P . "http://127.0.0.1:8080/$p" || true
          done
          # files fetched with ?ver=… lose the query (GitHub Pages ignores it)
          find . -name '*\?*' | while read f; do mv -f "$f" "${f%%\?*}"; done
          # fonts and pictures named in CSS
          find . -name "*.css" | while read f; do d=$(dirname "$f"); grep -oE "url\(['\"]?[^)'\"]+" "$f" | sed -E "s/url\(['\"]?//" | grep -vE '^(data:|#|http)' | while read u; do
              u=${u%%[?#]*}; dst=$(realpath -m "$d/$u"); rel=${dst#$PWD/}
              [ -f "$dst" ] || { mkdir -p "$(dirname "$dst")"; cp "$HOME/site/$rel" "$dst" 2>/dev/null || rm -f "$dst"; }
            done; done
          # scripts Elementor and WordPress load later on demand
          mkdir -p wp-content/plugins/elementor/assets/js wp-includes/js
          cp -r ~/site/wp-content/plugins/elementor/assets/js/. wp-content/plugins/elementor/assets/js/
          cp ~/site/wp-includes/js/wp-emoji-release.min.js wp-includes/js/ 2>/dev/null || true
          # every address to the test server becomes the live address; no search engine indexing
          grep -rlE '127\.0\.0\.1:8080' --include='*.html' --include='*.css' --include='*.js' --include='*.json' . | while read f; do
            sed -i -e "s#http://127.0.0.1:8080#$LIVE#g" -e "s#http:\\\\/\\\\/127.0.0.1:8080#${LIVE//\//\\\\/}#g" "$f"
          done
          find . -name "*.html" -exec sed -i 's#<head>#<head><meta name="robots" content="noindex">#' {} +
          touch .nojekyll
          echo "left: $(grep -rl '127.0.0.1' . | wc -l) files still naming the test server"
          grep -o 'href="[^"]*capture-features[^"]*"' index.html | sort -u
          du -sh .
      - uses: actions/configure-pages@v5
        with: { enablement: true }
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: /tmp/mirror }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - name: Check the live site
        run: |
          sleep 30
          B="https://dronedirector.github.io/Android-Projects"; mkdir out; fail=0
          for p in "" capture-features/ photo-editor-features/ video-editor-features/; do
            c=$(curl -s -o /tmp/p.html -w '%{http_code}' "$B/$p"); n=$(grep -o 'class="acs acs-' /tmp/p.html | wc -l)
            echo "$c $B/$p ($n sections)" | tee -a out/live.txt; [ "$c" = 200 ] || fail=1
          done
          # every file the pages load (wget follows page requisites and reports broken ones)
          wget -q -e robots=off --spider -r -l 2 -np -p "$B/" -o /tmp/spider.log || true
          grep -B2 -E "404|broken link" /tmp/spider.log | grep -oE "https?://[^ ]+" | sort -u > out/broken.txt || true
          echo "broken files: $(wc -l < out/broken.txt)" | tee -a out/live.txt
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          python3 - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def m():
              async with async_playwright() as p:
                  b=await p.chromium.launch(); pg=await b.new_page(viewport={'width':1440,'height':900}); e=[]
                  pg.on('pageerror',lambda x:e.append(str(x))); pg.on('console',lambda x:e.append(x.text) if x.type=='error' else None)
                  pg.on('requestfailed',lambda r:e.append('failed: '+r.url))
                  await pg.goto('https://dronedirector.github.io/Android-Projects/',wait_until='networkidle'); await pg.mouse.move(860,380); await pg.wait_for_timeout(2500)
                  await pg.screenshot(path='out/live-home.png')
                  await pg.click('a.acs-much'); await pg.wait_for_load_state('networkidle'); await pg.wait_for_timeout(1500)
                  await pg.screenshot(path='out/live-much-more.png'); e.append('much more -> '+pg.url)
                  # The same page at phone, tablet and desktop widths (colours must match on all of them).
                  for nm,w,h,sc in [('phone',412,915,2.625),('tablet-portrait',800,1280,2),('tablet-landscape',1280,800,2),('desktop',1440,900,1)]:
                      c=await b.new_context(viewport={'width':w,'height':h},device_scale_factor=sc,is_mobile=nm=='phone',has_touch=nm!='desktop'); q=await c.new_page()
                      await q.goto('https://dronedirector.github.io/Android-Projects/',wait_until='networkidle'); await q.wait_for_timeout(2500)
                      await q.screenshot(path=f'out/w-{nm}-hero.png')
                      st=await q.query_selector('.acs-stats')
                      if st:
                          await st.scroll_into_view_if_needed(); await q.wait_for_timeout(1500); await q.screenshot(path=f'out/w-{nm}-stats.png')
                      await c.close()
                  # Browsers' own dark modes (Chromium force-dark: Chrome, Edge, Opera, Brave, Samsung Internet's engine) must not recolour the site.
                  fb=await p.chromium.launch(args=['--enable-features=WebContentsForceDark','--force-dark-mode','--blink-settings=forceDarkModeEnabled=true'])
                  for nm,w,h,sc in [('phone',412,915,2.625),('tablet-landscape',1280,800,2)]:
                      c=await fb.new_context(viewport={'width':w,'height':h},device_scale_factor=sc,color_scheme='dark',is_mobile=nm=='phone',has_touch=True); q=await c.new_page()
                      await q.goto('https://dronedirector.github.io/Android-Projects/',wait_until='networkidle'); await q.wait_for_timeout(2500)
                      await q.screenshot(path=f'out/forcedark-{nm}-hero.png'); await c.close()
                  await fb.close()
                  open('out/live-browser.txt','w').write('\n'.join(e)); await b.close()
          asyncio.run(m())
          PY
          cat out/live-browser.txt
          cd out && git init -q -b website-live-check && git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Live check"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" website-live-check
          exit $fail
