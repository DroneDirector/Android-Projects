name: Website preview (GitHub Pages)
# Builds the website on a fresh WordPress + Elementor, saves the four pages as plain files and publishes
# them to GitHub Pages: https://dronedirector.github.io/Android-Projects/ (a preview — editing needs WordPress).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ "Website/**", ".github/workflows/website-pages.yml", ".github/scripts/website/**" ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: WordPress + Elementor + AlcorCut plugin
        run: bash .github/scripts/website/setup-wp.sh
      - name: Save the pages as plain files
        run: |
          mkdir -p /tmp/mirror && cd /tmp/mirror
          for p in "" capture-features/ photo-editor-features/ video-editor-features/; do
            wget -q -e robots=off --page-requisites --convert-links --adjust-extension --no-host-directories -P . "http://127.0.0.1:8080/$p" || true
          done
          # CSS files point at fonts and pictures too
          grep -rhoE "url\(['\"]?[^)'\"]+" --include=*.css . | sed -E "s/url\(['\"]?//" | grep -vE '^(data:|#)' | sort -u > /tmp/urls.txt || true
          find . -name "*.css" | while read f; do d=$(dirname "$f"); grep -oE "url\(['\"]?[^)'\"]+" "$f" | sed -E "s/url\(['\"]?//" | grep -vE '^(data:|#|http)' | while read u; do
              src="http://127.0.0.1:8080/$(realpath -m --relative-to=. "$d/${u%%[?#]*}")"; dst="$d/${u%%[?#]*}"
              [ -f "$dst" ] || { mkdir -p "$(dirname "$dst")"; wget -q -O "$dst" "$src" || rm -f "$dst"; }
            done; done
          # Any leftover absolute links to the test server become site-relative; no search engine indexing.
          find . -name "*.html" | while read f; do
            depth=$(echo "$f" | tr -cd '/' | wc -c); rel=$(printf '../%.0s' $(seq 2 $depth)); [ -z "$rel" ] && rel="./"
            sed -i -e "s#http://127.0.0.1:8080/#$rel#g" -e "s#http:\\\\/\\\\/127.0.0.1:8080\\\\/#$rel#g" -e 's#<head>#<head><meta name="robots" content="noindex">#' "$f"
          done
          touch .nojekyll
          find . -type f | sed 's#^\./##' | sort | head -80; du -sh .
          grep -c 'acs acs-' index.html
      - uses: actions/configure-pages@v5
        with: { enablement: true }
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: /tmp/mirror }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
