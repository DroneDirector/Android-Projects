name: Crash check (emulator)
# Started by hand: installs the latest release on an emulator, opens each editor and saves the crash log.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (empty = latest)"
        required: false
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir apk
          if [ -n "${{ inputs.tag }}" ]; then gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*.apk' -D apk
          else gh release download -R "${{ github.repository }}" -p '*.apk' -D apk; fi
          ls -la apk
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30:duration=4 -f lavfi -i sine=f=440:duration=4 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest test_clip.mp4
          ls -la test_clip.mp4
          cat > crash.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -x
          mkdir -p out
          adb wait-for-device
          adb install -r -g "$(ls apk/*.apk | head -1)" || echo "install failed"
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings put global hide_error_dialogs 1
          adb shell mkdir -p /sdcard/DCIM/VeyroCutPro
          adb push test_clip.mp4 /sdcard/DCIM/VeyroCutPro/VID_TEST.mp4
          adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/DCIM/VeyroCutPro/VID_TEST.mp4 || true
          adb shell content call --uri content://media/external/file --method scan_volume --arg external_primary >/dev/null 2>&1 || true
          sleep 5
          adb logcat -c
          for s in video photo video; do
            adb shell am force-stop com.dronedirector.veyrocutpro
            adb shell am start -W -n com.dronedirector.veyrocutpro/.MainActivity --es screen $s
            sleep 15
            adb exec-out screencap -p > out/screen-$s-$(date +%s).png
          done
          adb logcat -d -b crash > out/crash.txt || true
          adb logcat -d > out/logcat-full.txt || true
          grep -n -A40 "FATAL EXCEPTION" out/logcat-full.txt > out/fatal.txt || echo "no fatal exception" > out/fatal.txt
          cat out/fatal.txt | head -80
          SCRIPT
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash crash.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashcheck
          path: out
          if-no-files-found: warn
