name: Build AlcorCut Pro APK

# Every push to ProCamera/ builds the APK and takes emulator screenshots
# (pushed to the 'screenshots' branch). Nothing is published until the
# workflow is run by hand with "publish" ticked.
on:
  push:
    branches: [main]
    paths:
      - "ProCamera/**"
      - ".github/workflows/procam.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK on the Releases page"
        type: boolean
        default: false
      screenshots:
        description: "Also run the emulator screenshot test"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProCamera
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch AI upscale model (ESRGAN, Apache-2.0)
        run: |
          mkdir -p app/src/main/assets
          # The AI models and soundtracks are NOT in the APK: the app downloads them on first launch
          # from the "ai-models-v1" release (see AppData in ModelStore.kt).
          git fetch -q --depth 1 origin models
          mkdir -p app/src/main/assets/licenses && (git show FETCH_HEAD:MobileSAM-LICENSE.txt > app/src/main/assets/licenses/mobilesam-apache.txt 2>/dev/null || true)
          # Studio voice (DeepFilterNet3, MIT / Apache 2.0): native libraries built by the "AI model prep" workflow, and the model.
          for abi in arm64-v8a armeabi-v7a x86_64; do mkdir -p app/src/main/jniLibs/$abi; git show FETCH_HEAD:dfn/$abi/libdf.so > app/src/main/jniLibs/$abi/libdf.so || rm -f app/src/main/jniLibs/$abi/libdf.so; done
          git show FETCH_HEAD:dfn/DeepFilterNet-LICENSE-MIT > app/src/main/assets/licenses/deepfilternet-mit.txt 2>/dev/null || true
          # Other cameras' RAW formats: LibRaw (LGPL 2.1, its own replaceable libraw.so) and the app's bridge to it — built by the "LibRaw build" workflow.
          for abi in arm64-v8a armeabi-v7a x86_64; do for l in libraw libveyroraw; do git show FETCH_HEAD:libraw/$abi/$l.so > app/src/main/jniLibs/$abi/$l.so || rm -f app/src/main/jniLibs/$abi/$l.so; done; done
          git show FETCH_HEAD:libraw/LICENSE.LGPL > app/src/main/assets/licenses/libraw-lgpl-2.1.txt 2>/dev/null || true
          git show FETCH_HEAD:libraw/COPYRIGHT > app/src/main/assets/licenses/libraw-copyright.txt 2>/dev/null || true
          # Content credentials: the c2pa-android library (Apache 2.0 / MIT), built by the "Content credentials library" workflow.
          mkdir -p app/libs && git show FETCH_HEAD:c2pa/c2pa-release.aar > app/libs/c2pa-release.aar
          git show FETCH_HEAD:c2pa/LICENSE-MIT > app/src/main/assets/licenses/c2pa-mit.txt 2>/dev/null || true
          # Licence texts shown in the app (Settings → Open-source licences).
          mkdir -p app/src/main/assets/licenses
          curl -fsSL --retry 3 -o app/src/main/assets/licenses/apache-2.0.txt https://www.apache.org/licenses/LICENSE-2.0.txt \
            || echo "::warning::Apache licence text download failed; the app links to it instead"
          curl -fsSL --retry 3 -o app/src/main/assets/licenses/nafnet-mit.txt https://raw.githubusercontent.com/megvii-research/NAFNet/main/LICENSE \
            || echo "::warning::NAFNet licence text download failed; the app links to it instead"
          ls -l app/src/main/assets || true

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          V="1.0.${{ github.run_number }}"
          ls -l app/build/outputs/apk/release/
          # One APK per processor type: 64-bit phones (almost all), older 32-bit phones, and emulators / Chromebooks.
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "AlcorCutPro-ARM-$V.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "AlcorCutPro-$V-OLD-32bit-phones.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "AlcorCutPro-$V-EMULATOR-ONLY-x86_64.apk"
          # The watch remote (Wear OS, e.g. Galaxy Watch 4+).
          cp wear/build/outputs/apk/release/wear-release.apk "AlcorCutPro-WATCH-$V.apk" || echo "::warning::no watch APK"
          ls -l AlcorCutPro-*.apk

      - name: Save native debug symbols (for the Play Console)
        run: |
          # The app ships stripped native libraries; the full ones go to a separate zip, so native crash
          # reports in the Play Console can be read (Play Console → App bundle explorer → Downloads → upload).
          OUT="$PWD/AlcorCutPro-1.0.${{ github.run_number }}-native-debug-symbols.zip"
          SYM=app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if [ -f "$SYM" ]; then cp "$SYM" "$OUT"; else
            L=$(find app/build/intermediates/merged_native_libs/release -type d -name lib | head -1)
            [ -n "$L" ] && (cd "$L" && zip -qr "$OUT" .)
          fi
          ls -l "$OUT" || echo "no native symbols found"

      - name: Check method sizes (Android verifier limit)
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/dexcheck.py" $(ls AlcorCutPro-ARM-*.apk | head -1)

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|^   > |rror:|Lint found|Exception" build.log | grep -v "^> Task\|^> Configure" | head -80 > problems.txt || true
          # One annotation with every line (a step shows at most 10 separate ones).
          msg=$(sed -e 's/%/%25/g' -e 's|file:///home/runner/work/Android-Projects/Android-Projects/ProCamera/app/src/main/java/com/dronedirector/veyrocutpro/||' problems.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Compile problems::${msg}"
          mkdir -p /tmp/bl && cp build.log /tmp/bl/
          cd /tmp/bl && git init -q -b build-log && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Build log ${GITHUB_SHA::7}"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ProCamera/AlcorCutPro-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: ProCamera/AlcorCutPro-*-native-debug-symbols.zip
          if-no-files-found: ignore

  screenshots:
    needs: build
    # Off by default; only runs when started by hand with "screenshots" ticked.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.screenshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: bash ProCamera/scripts/screenshots.sh "$(ls apk/*x86_64*.apk | head -1)" shots

      - name: Save screenshots to the 'screenshots' branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Screenshots for ${GITHUB_SHA::7} (run ${{ github.run_number }})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: symbols
          path: symbols

      - name: Write release notes from the changelog
        run: |
          VER="1.0.${{ github.run_number }}"
          # Everything under "## Unreleased" becomes this version's notes.
          awk '/^## Unreleased/{f=1;next} /^## /{if(f)exit} f' ProCamera/CHANGELOG.md | sed '/^[[:space:]]*$/d' > notes.txt || true
          [ -s notes.txt ] || echo "- Maintenance and stability improvements." > notes.txt
          REPO="https://github.com/${{ github.repository }}/blob/main/ProCamera"
          {
            echo "## What's new in AlcorCut Pro $VER"
            echo
            cat notes.txt
            echo
            echo "📖 [Full feature list]($REPO/FEATURES.md) · 📝 [Changelog]($REPO/CHANGELOG.md)"
            echo
            echo "**Install:** tap **AlcorCutPro-ARM-$VER.apk** below to download, then open it to install — this is the one for your phone (all modern phones). Only for very old phones: …-OLD-32bit-phones.apk. Not for phones: …-EMULATOR-ONLY-x86_64.apk (PC emulators and Chromebooks)."
            echo
            echo "**Watch remote:** AlcorCutPro-WATCH-$VER.apk goes on a Wear OS watch (Galaxy Watch 4 or newer, Pixel Watch…) — see Guides and Tips for how to install it for testing."
            echo
            echo "On first launch the app downloads its AI models and soundtracks once (about 700 MB; it asks first on mobile data)."
            echo
            echo "_AlcorCutPro-$VER-native-debug-symbols.zip is for developers only (upload it to the Play Console with this version so native crash reports are readable)._"
          } > release-notes.md
          cat release-notes.md

      - name: Publish download on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="apk/AlcorCutPro-ARM-1.0.${{ github.run_number }}.apk"
          NAME=$(basename "$APK" .apk)
          SYM=$(ls symbols/*.zip 2>/dev/null | head -1)
          WATCH=$(ls apk/AlcorCutPro-WATCH-*.apk 2>/dev/null | head -1)
          gh release create "veyrocutpro-1.0.${{ github.run_number }}" "$APK" apk/*-OLD-32bit-phones.apk apk/*-EMULATOR-ONLY-x86_64.apk $WATCH $SYM \
            -R "${{ github.repository }}" \
            --title "AlcorCut Pro 1.0.${{ github.run_number }}" \
            --notes-file release-notes.md \
            --latest

      - name: Move "Unreleased" in the changelog under this version
        run: |
          VER="1.0.${{ github.run_number }}"
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # The entries this version was built with (later pushes may add more; those stay unreleased).
          python3 - <<'PY'
          s = open("ProCamera/CHANGELOG.md").read()
          i = s.index("## Unreleased\n") + len("## Unreleased\n"); j = s.find("\n## ", i)
          open("/tmp/entries.txt", "w").write(s[i:j if j >= 0 else len(s)].strip())
          PY
          for attempt in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 - "$VER" "$DATE" <<'PY'
          import sys
          ver, date = sys.argv[1], sys.argv[2]
          p = "ProCamera/CHANGELOG.md"
          s = open(p).read()
          mine = [l for l in open("/tmp/entries.txt").read().split("\n") if l.strip()]
          i = s.index("## Unreleased\n") + len("## Unreleased\n"); j = s.find("\n## ", i)
          if j < 0: j = len(s)
          cur = [l for l in s[i:j].split("\n") if l.strip()]
          rest = [l for l in cur if l not in mine]
          body = ("\n".join(rest) + "\n\n" if rest else "\n") + "## %s — %s\n" % (ver, date) + "\n".join(mine) + "\n"
          s = s[:i] + body + s[j:]
          open(p, "w").write(s)
          PY
            git add ProCamera/CHANGELOG.md
            git commit -q -m "Changelog: AlcorCut Pro $VER [skip ci]" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
