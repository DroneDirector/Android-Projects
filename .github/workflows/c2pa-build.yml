name: Content credentials library (c2pa-android)
# Started by hand: builds the open-source c2pa-android library (Apache 2.0 / MIT) at a fixed release and
# stores the AAR and its licences on the "models" branch, where the APK build picks it up.
on: workflow_dispatch
permissions:
  contents: write
env:
  C2PA_ANDROID_TAG: "0.0.17"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Build the library
        run: |
          git clone -q --depth 1 -b "$C2PA_ANDROID_TAG" https://github.com/contentauth/c2pa-android.git /tmp/c2pa
          cd /tmp/c2pa
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.version=$(basename $ANDROID_NDK_LATEST_HOME)" >> local.properties
          ./gradlew -q :library:assembleRelease 2>&1 | tail -40
          ls -la library/build/outputs/aar/
      - name: Store on the models branch
        run: |
          git fetch -q origin models
          git worktree add -q /tmp/models FETCH_HEAD
          cd /tmp/models
          rm -rf c2pa && mkdir -p c2pa
          cp /tmp/c2pa/library/build/outputs/aar/*release*.aar c2pa/c2pa-release.aar
          cp /tmp/c2pa/LICENSE-APACHE /tmp/c2pa/LICENSE-MIT c2pa/
          echo "$C2PA_ANDROID_TAG" > c2pa/VERSION
          ls -la c2pa
          git add -A c2pa
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "c2pa-android $C2PA_ANDROID_TAG" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:models
