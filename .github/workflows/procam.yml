name: Build VeyroCut Pro APK

# Every push to ProCamera/ builds the APK and takes emulator screenshots
# (pushed to the 'screenshots' branch). Nothing is published until the
# workflow is run by hand with "publish" ticked.
on:
  push:
    branches: [main]
    paths:
      - "ProCamera/**"
      - ".github/workflows/procam.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK on the Releases page"
        type: boolean
        default: false
      screenshots:
        description: "Also run the emulator screenshot test"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProCamera
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch AI upscale model (ESRGAN, Apache-2.0)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o app/src/main/assets/esrgan.tflite \
            https://storage.googleapis.com/download.tensorflow.org/models/tflite/esrgan/ESRGAN.tflite \
            || echo "::warning::ESRGAN model download failed; AI upscale will fall back to classic resize"
          curl -fsSL --retry 3 -o app/src/main/assets/nafnet.tflite \
            https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite \
            || echo "::warning::NAFNet model download failed; AI noise reduction will be unavailable"
          curl -fsSL --retry 3 -o app/src/main/assets/deeplab.tflite \
            https://storage.googleapis.com/download.tensorflow.org/models/tflite/gpu/deeplabv3_257_mv_gpu.tflite \
            || echo "::warning::DeepLab model download failed; on-phone AI subject masks will be unavailable"
          # Licence texts shown in the app (Settings → Open-source licences).
          mkdir -p app/src/main/assets/licenses
          curl -fsSL --retry 3 -o app/src/main/assets/licenses/apache-2.0.txt https://www.apache.org/licenses/LICENSE-2.0.txt \
            || echo "::warning::Apache licence text download failed; the app links to it instead"
          curl -fsSL --retry 3 -o app/src/main/assets/licenses/nafnet-mit.txt https://raw.githubusercontent.com/megvii-research/NAFNet/main/LICENSE \
            || echo "::warning::NAFNet licence text download failed; the app links to it instead"
          ls -l app/src/main/assets || true

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk "VeyroCutPro-1.0.${{ github.run_number }}.apk"

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: " build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          mkdir -p /tmp/bl && cp build.log /tmp/bl/
          cd /tmp/bl && git init -q -b build-log && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Build log ${GITHUB_SHA::7}"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ProCamera/VeyroCutPro-*.apk

  screenshots:
    needs: build
    # Off by default; only runs when started by hand with "screenshots" ticked.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.screenshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: bash ProCamera/scripts/screenshots.sh "$(ls apk/*.apk | head -1)" shots

      - name: Save screenshots to the 'screenshots' branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Screenshots for ${GITHUB_SHA::7} (run ${{ github.run_number }})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Write release notes from the changelog
        run: |
          VER="1.0.${{ github.run_number }}"
          # Everything under "## Unreleased" becomes this version's notes.
          awk '/^## Unreleased/{f=1;next} /^## /{if(f)exit} f' ProCamera/CHANGELOG.md | sed '/^[[:space:]]*$/d' > notes.txt || true
          [ -s notes.txt ] || echo "- Maintenance and stability improvements." > notes.txt
          REPO="https://github.com/${{ github.repository }}/blob/main/ProCamera"
          {
            echo "## What's new in VeyroCut Pro $VER"
            echo
            cat notes.txt
            echo
            echo "📖 [Full feature list]($REPO/FEATURES.md) · 📝 [Changelog]($REPO/CHANGELOG.md)"
            echo
            echo "**Install:** tap VeyroCutPro-$VER.apk below to download, then open it to install."
          } > release-notes.md
          cat release-notes.md

      - name: Publish download on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls apk/*.apk | head -1)
          NAME=$(basename "$APK" .apk)
          gh release create "veyrocutpro-1.0.${{ github.run_number }}" "$APK" \
            -R "${{ github.repository }}" \
            --title "${NAME/VeyroCutPro-/VeyroCut Pro }" \
            --notes-file release-notes.md \
            --latest

      - name: Move "Unreleased" in the changelog under this version
        run: |
          VER="1.0.${{ github.run_number }}"
          DATE=$(date -u +%Y-%m-%d)
          python3 - "$VER" "$DATE" <<'PY'
          import sys
          ver, date = sys.argv[1], sys.argv[2]
          p = "ProCamera/CHANGELOG.md"
          s = open(p).read()
          s = s.replace("## Unreleased\n", "## Unreleased\n\n## %s — %s\n" % (ver, date), 1)
          open(p, "w").write(s)
          PY
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ProCamera/CHANGELOG.md
          git commit -m "Changelog: VeyroCut Pro 1.0.${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase -q origin main && git push -q origin HEAD:main
