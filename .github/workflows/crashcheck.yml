name: Crash check (emulator)
# Started by hand: installs a build on an emulator, tries the features named in 'tests' (only the new ones each time) and saves the crash log.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (empty = latest)"
        required: false
        default: ""
      run:
        description: "Or: a build run id whose APK to test"
        required: false
        default: ""
      tests:
        description: "What to test (space-separated): setup layers transcribe morph magic slowmo highlights planar tts depth erase recover photo — or all. Empty = just open the editor with a clip."
        required: false
        default: ""
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: Get the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir apk
          if [ -n "${{ inputs.run }}" ]; then gh run download "${{ inputs.run }}" -R "${{ github.repository }}" -n apk -D apk
          elif [ -n "${{ inputs.tag }}" ]; then gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*.apk' -D apk
          else gh release download -R "${{ github.repository }}" -p '*.apk' -D apk; fi
          ls -la apk
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          sudo apt-get install -y -qq espeak-ng >/dev/null || true
          if command -v espeak-ng >/dev/null; then
            espeak-ng -s 140 -w speech.wav "Hello and welcome. Um, today we are testing the video editor. This is a short test of text based editing."
            ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30:duration=8 -i speech.wav -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 48000 -shortest test_clip.mp4
          else
            ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30:duration=4 -f lavfi -i sine=f=440:duration=4 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest test_clip.mp4
          fi
          ls -la test_clip.mp4
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1600x1200 -frames:v 1 -q:v 3 test_a.jpg
          ffmpeg -loglevel error -f lavfi -i "smptehdbars=size=1600x1200" -frames:v 1 -q:v 3 test_b.jpg
          echo "${{ inputs.tests }}" > tests.txt
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/scripts/crashcheck.sh" -o crash.sh || { echo "could not fetch the test script"; exit 1; }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash crash.sh
      - name: Save results to the 'crashcheck' branch
        if: always()
        run: |
          [ -d out ] || exit 0
          rm -f out/logcat-full.txt.gz; gzip -k out/logcat-full.txt 2>/dev/null; rm -f out/logcat-full.txt
          cd out
          git init -q -b crashcheck
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Crash check ${{ inputs.tag }} (run ${{ github.run_number }})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" crashcheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashcheck
          path: out
          if-no-files-found: warn
