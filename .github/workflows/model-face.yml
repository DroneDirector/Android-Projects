name: Face recognition model (SFace)
# Started by hand: fetches OpenCV Zoo's SFace face-recognition model (Apache 2.0), checks it, runs it once
# and adds it to the app's AI model downloads (release ai-models-v1). The log is added there too.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download, check and run once
        run: |
          set -o pipefail
          {
            git clone -q --depth 1 --filter=blob:none --sparse https://github.com/opencv/opencv_zoo.git zoo
            cd zoo && git sparse-checkout set models/face_recognition_sface && git lfs install --local && git lfs pull --include="models/face_recognition_sface/face_recognition_sface_2021dec.onnx" && cd ..
            cp zoo/models/face_recognition_sface/face_recognition_sface_2021dec.onnx face_sface_2021dec.onnx
            cp zoo/models/face_recognition_sface/LICENSE SFace-LICENSE.txt
            ls -la face_sface_2021dec.onnx
            echo "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79  face_sface_2021dec.onnx" | sha256sum -c -
            head -3 SFace-LICENSE.txt
            pip install -q onnxruntime==1.19.2 numpy
            printf '%s\n' "import onnxruntime as ort, numpy as np" \
              "s = ort.InferenceSession('face_sface_2021dec.onnx')" \
              "i = s.get_inputs()[0]; o = s.get_outputs()[0]" \
              "print('input', i.name, i.shape, i.type, 'output', o.name, o.shape)" \
              "y = s.run(None, {i.name: (np.random.rand(1, 3, 112, 112) * 255).astype(np.float32)})[0]" \
              "print('embedding', y.shape)" > t.py
            python3 t.py
          } 2>&1 | tee face-model-log.txt
      - name: Add to the AI model downloads
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload ai-models-v1 face_sface_2021dec.onnx SFace-LICENSE.txt face-model-log.txt --clobber -R "$GITHUB_REPOSITORY"
      - name: Log on failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload ai-models-v1 face-model-log.txt --clobber -R "$GITHUB_REPOSITORY" || true
