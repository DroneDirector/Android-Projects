name: RAW samples watch
# Every day: looks for new RAW samples on raw.pixls.us (public domain, CC0). Nothing is added
# automatically: new models (from makers we already test) and new makers are listed in an issue
# (label raw-watch) that asks the owner. Approved files are added by the "RAW samples add" workflow.
on:
  schedule: [{ cron: "17 5 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: { group: raw-watch, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare with raw.pixls.us
        run: |
          curl -fsSL --retry 3 -o /tmp/filelist.txt https://raw.pixls.us/data/filelist.sha256
          python3 .github/scripts/raw_watch.py /tmp/filelist.txt .github/raw-samples.txt .github/raw-samples-seen.txt /tmp/added.txt /tmp/new-makers.txt
          echo "--- new models"; cat /tmp/added.txt; echo "--- new makers"; cat /tmp/new-makers.txt
      - name: Ask the owner
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -s /tmp/added.txt ] || [ -s /tmp/new-makers.txt ]; then
            { echo "New RAW samples appeared on raw.pixls.us (public domain). **Do you want to add these new models and their RAW data to your app's RAW test (and our own copy of the samples)?** Nothing is added until you say yes."
              echo
              if [ -s /tmp/added.txt ]; then echo "### New models from makers already in the test"; echo '```'; cat /tmp/added.txt; echo '```'; fi
              if [ -s /tmp/new-makers.txt ]; then echo "### New makers (not in the test yet)"; sed 's/^/- /' /tmp/new-makers.txt; fi
              echo
              echo "To add: say \"add them\" in the chat, or run the **RAW samples add** workflow (Actions tab) with this issue's number."
            } > /tmp/body.md
            gh label create raw-watch -R "$GITHUB_REPOSITORY" -c FFB300 -d "RAW samples watch" 2>/dev/null || true
            gh issue create -R "$GITHUB_REPOSITORY" -l raw-watch -t "New RAW samples on raw.pixls.us — add them to the app?" -F /tmp/body.md
          fi
          git config user.name github-actions; git config user.email actions@github.com
          git add .github/raw-samples-seen.txt
          git diff --cached --quiet || { git commit -qm "RAW samples watch: remember what raw.pixls.us has"; git pull -q --rebase && git push -q; }
