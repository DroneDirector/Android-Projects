name: Move release tags (one time)
# Points every release tag at its commit in the cleaned history (.github/tag-map.txt: "tag sha" per line).
on: workflow_dispatch
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Move the tags
        run: |
          git fetch -q --all
          n=0
          while read t s; do
            git cat-file -e "$s^{commit}" || { echo "::error::missing commit for $t"; exit 1; }
            git tag -f "$t" "$s" >/dev/null; n=$((n+1))
          done < .github/tag-map.txt
          git push -f origin $(awk '{print "refs/tags/"$1}' .github/tag-map.txt)
          echo "moved $n tags"
