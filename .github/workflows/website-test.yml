name: Website test (WordPress + Elementor)
# Installs a fresh WordPress with the free Elementor plugin, activates Website/alcorcut-site, checks the
# pages and saves screenshots (also of the Elementor editor) to the 'website-preview' branch.
on:
  workflow_dispatch:
  push:
    paths: [ "Website/**", ".github/workflows/website-test.yml", ".github/scripts/website/**" ]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: WordPress + Elementor
        run: |
          sudo systemctl start mysql.service
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar && sudo mv /tmp/wp-cli.phar /usr/local/bin/wp-cli.phar
          printf '#!/bin/sh\nexec php -d display_errors=0 -d error_reporting=0 /usr/local/bin/wp-cli.phar "$@"\n' | sudo tee /usr/local/bin/wp >/dev/null && sudo chmod +x /usr/local/bin/wp
          mkdir -p ~/site && cd ~/site
          wp core download --quiet
          wp config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          wp config set WP_DEBUG true --raw; wp config set WP_DEBUG_LOG true --raw; wp config set WP_DEBUG_DISPLAY false --raw
          wp db create
          wp core install --url=http://127.0.0.1:8080 --title="AlcorCut Pro" --admin_user=admin --admin_password=admin --admin_email=test@example.com --skip-email
          wp rewrite structure '/%postname%/' --quiet
          wp plugin install elementor --activate
          cp -r "$GITHUB_WORKSPACE/Website/alcorcut-site" wp-content/plugins/
          wp plugin activate alcorcut-site
          wp option get acs_pages --format=json | tee /tmp/pages.json
          wp post list --post_type=page --fields=ID,post_title,post_name,page_template
          wp option get page_on_front
          nohup wp server --host=127.0.0.1 --port=8080 --path=$HOME/site > /tmp/server.log 2>&1 &
          sleep 4
      - name: Check the pages and take screenshots
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          bash .github/scripts/website/check.sh
      - name: Save to the 'website-preview' branch
        if: always()
        run: |
          cd out && git init -q -b website-preview && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Website test (run ${{ github.run_number }})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" website-preview
