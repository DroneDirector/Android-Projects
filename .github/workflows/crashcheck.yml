name: Crash check (emulator)
# Started by hand: installs the latest release on an emulator, opens each editor and saves the crash log.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (empty = latest)"
        required: false
        default: ""
      run:
        description: "Or: a build run id whose APK to test"
        required: false
        default: ""
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir apk
          if [ -n "${{ inputs.run }}" ]; then gh run download "${{ inputs.run }}" -R "${{ github.repository }}" -n apk -D apk
          elif [ -n "${{ inputs.tag }}" ]; then gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*.apk' -D apk
          else gh release download -R "${{ github.repository }}" -p '*.apk' -D apk; fi
          ls -la apk
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          sudo apt-get install -y -qq espeak-ng >/dev/null || true
          if command -v espeak-ng >/dev/null; then
            espeak-ng -s 140 -w speech.wav "Hello and welcome. Um, today we are testing the video editor. This is a short test of text based editing."
            ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30:duration=8 -i speech.wav -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 48000 -shortest test_clip.mp4
          else
            ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30:duration=4 -f lavfi -i sine=f=440:duration=4 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest test_clip.mp4
          fi
          ls -la test_clip.mp4
          cat > crash.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -x
          mkdir -p out
          adb wait-for-device
          adb install -r -g "$(ls apk/*.apk | head -1)" || echo "install failed"
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings put global hide_error_dialogs 1
          adb shell settings put global anr_show_background 0
          for L in com.google.android.apps.nexuslauncher com.android.launcher3; do adb shell pm disable-user --user 0 "$L" >/dev/null 2>&1 || true; done
          adb shell mkdir -p /sdcard/DCIM/VeyroCutPro
          adb push test_clip.mp4 /sdcard/DCIM/VeyroCutPro/VID_TEST.mp4
          adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/DCIM/VeyroCutPro/VID_TEST.mp4 || true
          adb shell content call --uri content://media/external/file --method scan_volume --arg external_primary >/dev/null 2>&1 || true
          sleep 5
          adb logcat -c
          tapText() {  # tap the centre of the first on-screen element whose text contains $1
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
            adb shell cat /sdcard/ui.xml > ui.xml
            local xy
            xy=$(python3 - "$1" <<'PY'
          import re,sys
          t=open('ui.xml',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'<node [^>]*>', t):
              n=m.group(0)
              tx=re.search(r'text="([^"]*)"',n); b=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',n)
              if tx and b and sys.argv[1].lower() in tx.group(1).lower():
                  x1,y1,x2,y2=map(int,b.groups()); print((x1+x2)//2,(y1+y2)//2); break
          PY
          )
            echo "tap '$1' at: $xy"
            [ -n "$xy" ] && adb shell input tap $xy
          }
          shot() { adb exec-out screencap -p > "out/$1.png"; }
          start_video() { adb shell am force-stop com.dronedirector.veyrocutpro; adb shell am start -W -n com.dronedirector.veyrocutpro/.MainActivity --es screen video; sleep 12; }
          start_video; shot 01-video-start
          tapText "Skip"; sleep 15; shot 02-skip-workspace
          start_video
          tapText "MP4"; sleep 30; shot 03-clip-workspace
          sleep 25; shot 04-clip-after-autosave
          tapText "+ VIDEO"; sleep 3; shot 04b-video-layer-dialog
          tapText "ABOVE the main video"; sleep 6; shot 04c-picker
          adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb shell cat /sdcard/ui.xml > out/picker.xml
          # Tap the first media item in the photo picker (content-desc mentions Video / Photo).
          XY=$(python3 - <<'PY'
          import re
          t=open('out/picker.xml',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'<node [^>]*>', t):
              n=m.group(0)
              d=re.search(r'content-desc="([^"]*)"',n); b=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',n)
              if d and b and re.search(r'video|taken|VID_', d.group(1), re.I):
                  x1,y1,x2,y2=map(int,b.groups()); print((x1+x2)//2,(y1+y2)//2); break
          PY
          )
          echo "picker item at: $XY"; [ -n "$XY" ] && adb shell input tap $XY
          sleep 8; shot 04d-after-add-above
          tapText "Layers"; sleep 3; shot 04e-layers-page
          # Text-based editing: download the speech model and transcribe the clip.
          tapText "Text"; sleep 3; shot 04f-text-page
          tapText "DOWNLOAD MODEL"; for i in $(seq 1 24); do sleep 5; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb shell cat /sdcard/ui.xml | grep -q "Model ready" && break; done
          shot 04g-model
          tapText "TRANSCRIBE"; for i in $(seq 1 36); do sleep 5; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb shell cat /sdcard/ui.xml | grep -q "APPLY CUTS\|TAP WORDS\|No speech" && break; done
          sleep 2; shot 04h-transcript
          adb logcat -d | grep -i -E "veyrocut_native|veyrocut_whisper|UnsatisfiedLink|whisper" | tail -20 > out/native.txt || true
                    start_video; shot 05-recover-banner
          tapText "RECOVER"; sleep 25; shot 06-after-recover
          adb shell am force-stop com.dronedirector.veyrocutpro
          adb shell am start -W -n com.dronedirector.veyrocutpro/.MainActivity --es screen photo; sleep 10; shot 07-photo
          adb logcat -d -b crash > out/crash.txt || true
          adb logcat -d > out/logcat-full.txt || true
          grep -n -A40 "FATAL EXCEPTION" out/logcat-full.txt > out/fatal.txt || echo "no fatal exception" > out/fatal.txt
          cat out/fatal.txt | head -80
          SCRIPT
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash crash.sh
      - name: Save results to the 'crashcheck' branch
        if: always()
        run: |
          [ -d out ] || exit 0
          rm -f out/logcat-full.txt.gz; gzip -k out/logcat-full.txt 2>/dev/null; rm -f out/logcat-full.txt
          cd out
          git init -q -b crashcheck
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Crash check ${{ inputs.tag }} (run ${{ github.run_number }})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" crashcheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashcheck
          path: out
          if-no-files-found: warn
